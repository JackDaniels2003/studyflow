# Blueprint do Render: em render.com > New > Blueprint, escolha este repositorio.
# As duas variaveis do Supabase sao pedidas na criacao (sync: false = voce preenche).
services:
  - type: web
    name: studyflow
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
